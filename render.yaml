services:
  - type: web
    name: pentest-ide-backend
    env: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PENTEST_IDE_API_KEYS
        generateValue: true
      - key: REQUIRE_PUBLIC_TARGETS
        value: "true"
      - key: LOG_PRETTY
        value: "false"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
